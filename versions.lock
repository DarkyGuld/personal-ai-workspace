## Target Environment Specification

- **Target Host OS**: Ubuntu Server 24.04 LTS
- **Target Hardware**: Lenovo Legion 5 15ARH05H (AMD Ryzen 5 4600H, 16 GB DDR4 RAM, NVIDIA GeForce RTX 2060 6 GB VRAM, 512 GB NVMe SSD)
- **Deployment Mode**: Docker Compose (no Kubernetes)
