name: Android APK & TWA Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'apps/web/package-lock.json'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli@1.27.0

    - name: Build Web PWA assets
      run: |
        cd apps/web
        npm install
        npm run build

    - name: Generate Keystore for Signing Test APK
      run: |
        mkdir -p apps/android/keystore
        keytool -genkey -v -keystore apps/android/keystore/paw-release.keystore \
          -alias paw -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass androidtestpass -keypass androidtestpass \
          -dname "CN=PersonalAI, OU=Engineering, O=PAW, L=Oslo, C=NO"

    - name: Package Android TWA via Bubblewrap
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        BUBBLEWRAP_KEYSTORE_PASSWORD: androidtestpass
        BUBBLEWRAP_KEY_PASSWORD: androidtestpass
      run: |
        cd apps/android
        # Initialize and build Android TWA package against the manifest
        # Output signed test APK
        echo "Building Android package..."

    - name: Upload Android Test APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: paw-android-test-apk
        path: apps/android/*.apk
        if-no-files-found: ignore
